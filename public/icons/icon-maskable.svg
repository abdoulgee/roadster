<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06060c"/>
      <stop offset="0.42" stop-color="#150e20"/>
      <stop offset="0.68" stop-color="#351023"/>
      <stop offset="0.84" stop-color="#1b0c19"/>
      <stop offset="1" stop-color="#08070d"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.64" r="0.62">
      <stop offset="0" stop-color="#ff7a4d" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#ff3b4e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.72" r="0.62">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.42" stop-color="#ffa33d"/>
      <stop offset="0.78" stop-color="#ff4d5e"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2738"/>
      <stop offset="0.38" stop-color="#13111c"/>
      <stop offset="1" stop-color="#06060b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5ebff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#26546b" stop-opacity="0.92"/>
      <stop offset="0.7" stop-color="#0c131c"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3d"/>
      <stop offset="0.45" stop-color="#ff3b4e"/>
      <stop offset="1" stop-color="#ffc640"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc640" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff8a3d" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ff4d5e" stop-opacity="0.95"/>
      <stop offset="0.86" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#fff6e2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7f6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d7f6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160d1a"/>
      <stop offset="1" stop-color="#07060c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <clipPath id="sunClip">
      <circle cx="256" cy="320" r="146"/>
    </clipPath>
    <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurMd" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurSm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#horizon)"/>

  <!-- ART START -->

  <g transform="translate(256 256) scale(0.84) translate(-256 -256)">
  <!-- Stars -->
  <g fill="#f6f1ea">
    <circle cx="74" cy="86" r="1.8" opacity="0.55"/>
    <circle cx="128" cy="48" r="1.3" opacity="0.35"/>
    <circle cx="196" cy="104" r="1.5" opacity="0.45"/>
    <circle cx="312" cy="58" r="1.7" opacity="0.5"/>
    <circle cx="382" cy="112" r="1.2" opacity="0.35"/>
    <circle cx="438" cy="62" r="2" opacity="0.55"/>
    <circle cx="462" cy="150" r="1.3" opacity="0.3"/>
    <circle cx="58" cy="172" r="1.4" opacity="0.35"/>
    <circle cx="372" cy="186" r="1.1" opacity="0.3"/>
    <circle cx="214" cy="154" r="1.2" opacity="0.28"/>
  </g>

  <!-- Retro sun on the horizon -->
  <circle cx="256" cy="320" r="146" fill="url(#sun)"/>
  <circle cx="256" cy="320" r="146" fill="none" stroke="#ffd88a" stroke-opacity="0.4" stroke-width="2" filter="url(#blurSm)"/>
  <g clip-path="url(#sunClip)" fill="#1a0c1c">
    <rect x="0" y="342" width="512" height="6" opacity="0.95"/>
    <rect x="0" y="360" width="512" height="8" opacity="0.95"/>
    <rect x="0" y="382" width="512" height="10" opacity="0.95"/>
    <rect x="0" y="408" width="512" height="13" opacity="0.95"/>
    <rect x="0" y="438" width="512" height="16" opacity="0.95"/>
  </g>

  <!-- Speed streaks -->
  <g stroke-linecap="round" fill="none">
    <path d="M36 246h74" stroke="#ff3b4e" stroke-width="3" opacity="0.55"/>
    <path d="M58 268h72" stroke="#f6f1ea" stroke-width="2" opacity="0.22"/>
    <path d="M28 300h58" stroke="#ff8a3d" stroke-width="2.5" opacity="0.4"/>
    <path d="M44 322h48" stroke="#f6f1ea" stroke-width="1.6" opacity="0.16"/>
    <path d="M426 286h62" stroke="#8fe3ff" stroke-width="2" opacity="0.28"/>
    <path d="M452 308h40" stroke="#f6f1ea" stroke-width="1.6" opacity="0.18"/>
  </g>
  </g>
  <!-- Ground and grid -->
  <rect x="0" y="406" width="512" height="106" fill="url(#ground)"/>
  <path d="M0 406h512" stroke="#ff5a68" stroke-width="1.4" opacity="0.35"/>
  <g stroke="#8fe3ff" fill="none" stroke-width="1">
    <path d="M256 406 118 512M256 406 206 512M256 406 306 512M256 406 394 512" opacity="0.14"/>
    <path d="M0 432h512" opacity="0.1"/>
    <path d="M0 464h512" opacity="0.13"/>
    <path d="M0 500h512" opacity="0.16"/>
  </g>


  <g transform="translate(256 256) scale(0.84) translate(-256 -256)">
  <!-- Hover glow under the car -->
  <ellipse cx="262" cy="396" rx="164" ry="21" fill="#8fe3ff" opacity="0.34" filter="url(#blurLg)"/>
  <ellipse cx="262" cy="396" rx="96" ry="9" fill="#d7f6ff" opacity="0.45" filter="url(#blurMd)"/>

  <!-- The car -->
  <g transform="translate(256 310) rotate(-7) translate(-256 -316)">
    <!-- Rear thruster flame -->
    <path d="M146 314C100 288 34 288 0 302c46 38 102 54 146 52z" fill="#ff4d2e" opacity="0.55" filter="url(#blurLg)"/>
    <path d="M140 318C98 296 40 296 0 308c44 32 98 46 140 44z" fill="#ff8a3d" opacity="0.45" filter="url(#blurMd)"/>
    <path d="M136 320C98 300 44 300 0 312c44 28 96 42 136 40z" fill="url(#flame)" opacity="0.98"/>
    <path d="M132 328c-34-10-72-9-104 1 32 12 72 17 104 15z" fill="#ffd9a8" opacity="0.9"/>
    <path d="M131 332c-22-4-46-3-66 1 20 5 46 7 66 6z" fill="#fffaf0"/>
    <g fill="#ffc640">
      <circle cx="46" cy="310" r="2.2" opacity="0.7"/>
      <circle cx="22" cy="320" r="1.5" opacity="0.5"/>
      <circle cx="66" cy="304" r="1.3" opacity="0.55"/>
    </g>

    <!-- Hover jets under the floor -->
    <path d="M228 348l30 0-6 34-18 0z" fill="#8fe3ff" opacity="0.24" filter="url(#blurMd)"/>
    <path d="M330 348l30 0-6 34-18 0z" fill="#8fe3ff" opacity="0.24" filter="url(#blurMd)"/>

    <!-- Wheels (tucked; the arches show their lower half) -->
    <g>
      <circle cx="200" cy="352" r="34" fill="#05050a" stroke="#2a2a38" stroke-width="2.5"/>
      <circle cx="200" cy="352" r="20" fill="#0e1620"/>
      <circle cx="200" cy="352" r="20" fill="none" stroke="#8fe3ff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M200 339v26M187 352h26" stroke="#8fe3ff" stroke-opacity="0.34" stroke-width="2"/>
      <circle cx="200" cy="352" r="6" fill="#8fe3ff" opacity="0.9"/>
    </g>
    <g>
      <circle cx="358" cy="352" r="34" fill="#05050a" stroke="#2a2a38" stroke-width="2.5"/>
      <circle cx="358" cy="352" r="20" fill="#0e1620"/>
      <circle cx="358" cy="352" r="20" fill="none" stroke="#8fe3ff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M358 339v26M345 352h26" stroke="#8fe3ff" stroke-opacity="0.34" stroke-width="2"/>
      <circle cx="358" cy="352" r="6" fill="#8fe3ff" opacity="0.9"/>
    </g>

    <!-- Body -->
    <path
      d="M120 340c-2-10 2-20 14-26l34-6 30-2 18 0 26-38c10-13 26-18 46-18l32 0c14 0 24 6 31 16l29 40 18 5c12 4 20 13 23 22 2 7-1 13-9 16l-14 2c-3-13-11-20-26-20s-23 7-26 20l-107 0c-3-13-11-20-26-20s-23 7-26 20l-51 0c-11-2-16-5-17-11z"
      fill="url(#body)"
      stroke="#05050a"
      stroke-width="2"
    />

    <!-- Tail light and thruster nozzle -->
    <rect x="120" y="312" width="7" height="17" rx="3" fill="#ff3b4e" opacity="0.95"/>
    <rect x="114" y="312" width="19" height="17" rx="8" fill="#ff3b4e" opacity="0.4" filter="url(#blurMd)"/>
    <circle cx="129" cy="336" r="11" fill="#120b10" stroke="#ff8a3d" stroke-width="2"/>
    <circle cx="129" cy="336" r="5" fill="#ffd9a8"/>
    <circle cx="129" cy="336" r="10" fill="#ff8a3d" opacity="0.45" filter="url(#blurSm)"/>

    <!-- Top rim light -->
    <path
      d="M134 314l34-6 30-2 18 0 26-38c10-13 26-18 46-18l32 0c14 0 24 6 31 16l29 40 18 5c12 4 20 13 23 22"
      fill="none"
      stroke="url(#rim)"
      stroke-width="3.4"
      stroke-linecap="round"
      filter="url(#blurSm)"
      opacity="0.9"
    />
    <path
      d="M134 314l34-6 30-2 18 0 26-38c10-13 26-18 46-18l32 0c14 0 24 6 31 16l29 40 18 5c12 4 20 13 23 22"
      fill="none"
      stroke="#ffd9c2"
      stroke-width="1.3"
      stroke-linecap="round"
      opacity="0.7"
    />

    <!-- Cabin -->
    <path d="M246 298c10-23 25-36 45-40l32 0c15 2 25 10 31 21l15 19z" fill="url(#glass)"/>
    <path d="M251 294c9-18 21-30 39-34l31 0c13 2 22 9 28 18" fill="none" stroke="#bdefff" stroke-width="1.6" opacity="0.65"/>
    <path d="M278 262l-31 36" stroke="#d8f7ff" stroke-width="3.2" opacity="0.16"/>
    <path d="M301 260l-35 38" stroke="#d8f7ff" stroke-width="1.6" opacity="0.12"/>

    <!-- Side crease and livery -->
    <path d="M152 324c66-12 168-14 252-2" fill="none" stroke="#ff3b4e" stroke-width="2.2" opacity="0.55"/>
    <path d="M212 338c42-6 104-6 146-1" fill="none" stroke="#8fe3ff" stroke-width="1.6" opacity="0.38"/>
    <path d="M238 348c30-3 74-3 104 0" fill="none" stroke="#8fe3ff" stroke-width="1.4" opacity="0.55"/>

    <!-- Headlight -->
    <path d="M394 321c11 2 19 6 25 12" fill="none" stroke="#e6faff" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 320c13 2 22 7 29 14" fill="none" stroke="#8fe3ff" stroke-width="9" stroke-linecap="round" opacity="0.45" filter="url(#blurMd)"/>

    <!-- Front splitter -->
    <path d="M398 349l20-3-2 6-18 1z" fill="#0d0c15" stroke="#ff3b4e" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Headlight beam -->
    <path d="M420 326c26-6 52-12 84-18v52c-32-6-58-12-84-18z" fill="url(#beam)"/>

    <!-- Side vent -->
    <path d="M334 322l14 0M330 328l18 0M334 334l14 0" stroke="#05050a" stroke-width="2" opacity="0.75"/>
  </g>

  <!-- Floating dust -->
  <g fill="#d7f6ff">
    <circle cx="150" cy="390" r="2.4" opacity="0.5"/>
    <circle cx="196" cy="402" r="1.5" opacity="0.35"/>
    <circle cx="352" cy="398" r="1.8" opacity="0.4"/>
    <circle cx="400" cy="388" r="1.2" opacity="0.3"/>
  </g>
  </g>
  <!-- Vignette -->
  <rect width="512" height="512" fill="url(#vignette)"/>
  <!-- ART END -->
</svg>
